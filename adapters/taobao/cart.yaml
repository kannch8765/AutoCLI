# Original author: jackwener | License: Apache-2.0
site: taobao
name: cart
description: "查看淘宝购物车"
domain: cart.taobao.com
strategy: cookie
browser: true
siteSession: persistent
args:
  limit:
    type: int
    default: 20
    description: "返回数量 (max 50)"
columns: [index, title, price, spec, shop]
pipeline:
  - navigate: https://www.taobao.com
  - wait: 2
  - navigate: https://cart.taobao.com/cart.htm
  - wait: 6
  - scroll:
      times: 3
      delay: 1500
  - evaluate: |
      (() => {
        const limit = Math.min(Math.max(Number(${{ args.limit | default(20) | json }}), 1), 50);
        const text = document.body?.innerText || '';
        if (text.length < 500 || text.includes('请登录')) throw new Error('taobao cart requires a logged-in Taobao session');
        const sections = text.split(/移入收藏/); const results = [];
        for (const section of sections) {
          const lines = section.split('\n').map(l => l.trim()).filter(Boolean); if (lines.length < 3) continue;
          let title = ''; let titleIdx = -1;
          for (let i = 0; i < lines.length; i++) { const l = lines[i]; if (l.length > 15 && l.length < 200 && !l.match(/^(删除|全选|全部商品|合计|结算|找同款|退货|￥|¥|\d+$|颜色|尺码|规格|套餐|主板|运行)/) && l.length > title.length) { title = l; titleIdx = i; } }
          if (!title) continue;
          let price = '';
          for (let i = 0; i < lines.length; i++) { if (lines[i] === '￥' || lines[i] === '¥') { let p = ''; for (let j = i + 1; j < Math.min(i + 4, lines.length); j++) { if (lines[j].match(/^[\d,.]+$/)) p += lines[j]; else if (lines[j] === '.') p += '.'; else break; } if (p) { price = '￥' + p; break; } } }
          let spec = ''; for (const l of lines) { if (l.match(/^(颜色分类|尺码|规格|套餐|主板|运行)[：:]/)) { spec = l.slice(0, 40); break; } }
          let shop = ''; if (titleIdx > 0) { const prev = lines[titleIdx - 1]; if (prev && prev.length > 2 && prev.length < 30 && !prev.match(/^(删除|\d|￥|¥|券|退|满|超)/)) shop = prev; }
          results.push({ index: results.length + 1, title: title.slice(0, 80), price, spec, shop }); if (results.length >= limit) break;
        }
        return results;
      })()
