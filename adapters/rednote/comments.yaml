# Adapter logic derived from OpenCLI (https://github.com/jackwener/opencli)
# Original author: jackwener | License: Apache-2.0
site: rednote
name: comments
description: "读取 REDnote 笔记评论（支持楼中楼子回复）"
domain: www.rednote.com
strategy: cookie
browser: true
siteSession: persistent

args:
  note_url:
    positional: true
    type: string
    required: true
    description: Full signed REDnote note URL with xsec_token
  limit:
    type: int
    default: 20
    description: Number of top-level comments (1-50)
  with_replies:
    type: bool
    default: false
    description: Include nested replies; reply_to is the direct target shown by the page

columns: [rank, author, text, likes, time, is_reply, reply_to, images]

pipeline:
  - navigate: ${{ args.note_url }}
  # AutoCLI wait accepts constants only; use 3s within upstream's 2-5s window.
  - wait: 3
  - evaluate: |
      (async () => {
        const wait = (ms) => new Promise(r => setTimeout(r, ms))
        const withReplies = ${{ args.with_replies | default(false) | json }}
        const targetCount = Number(${{ args.limit | default(20) | json }})
        if (!Number.isInteger(targetCount) || targetCount < 1 || targetCount > 50) {
          throw new Error('rednote comments: ARGUMENT — limit must be an integer between 1 and 50')
        }

        const bodyText = document.body?.innerText || ''
        const loginWall = /登录后查看|请登录/.test(bodyText)
        const securityBlock = /安全限制|访问链接异常/.test(bodyText)
          || /website-login\/error|error_code=300017|error_code=300031/.test(location.href)
        if (securityBlock) throw new Error('rednote comments: SECURITY_BLOCK — page temporarily restricted; try again later or from a different session')
        if (loginWall) throw new Error('rednote comments: LOGIN_REQUIRED — note comments require login')

        const scroller = document.querySelector('.note-scroller') || document.querySelector('.container')
        const driveScroll = () => {
          if (scroller) scroller.scrollTo(0, scroller.scrollHeight)
          const comments = document.querySelectorAll('.parent-comment')
          const last = comments[comments.length - 1]
          if (last && typeof last.scrollIntoView === 'function') last.scrollIntoView({ block: 'end' })
          if (typeof window !== 'undefined' && typeof window.scrollTo === 'function') {
            window.scrollTo(0, document.body.scrollHeight)
          }
        }
        {
          let stall = 0
          for (let i = 0; i < 60; i++) {
            const beforeCount = document.querySelectorAll('.parent-comment').length
            if (beforeCount >= targetCount) break
            driveScroll()
            await wait(1000 + Math.random() * 1200)
            const afterCount = document.querySelectorAll('.parent-comment').length
            if (afterCount <= beforeCount) {
              stall++
              if (stall >= 6) break
            } else {
              stall = 0
            }
          }
        }

        const clean = (el) => (el?.textContent || '').replace(/\s+/g, ' ').trim()
        const parseLikeCountText = (value) => {
          const integerRe = /^(?:\d+|\d{1,3}(?:[,，]\d{3})+)\+?$/u
          const shortformRe = /^((?:\d+|\d{1,3}(?:[,，]\d{3})+)(?:\.\d+)?)([wWkK万千])\+?$/u
          const raw = String(value ?? '').replace(/\s+/g, '')
          if (!raw) return 0
          if (integerRe.test(raw)) return Number(raw.replace(/[,+，]/g, ''))
          const short = raw.match(shortformRe)
          if (!short) return 0
          const numeric = Number(short[1].replace(/[,，]/g, ''))
          if (!Number.isFinite(numeric)) return 0
          const unit = short[2].toLowerCase()
          const multiplier = unit === 'w' || unit === '万' ? 10000 : 1000
          return Math.round(numeric * multiplier)
        }
        const parseLikes = (el) => parseLikeCountText(clean(el))
        const extractImages = (el) => {
          if (!el) return []
          const urls = []
          el.querySelectorAll('img').forEach(img => {
            if (img.classList.contains('avatar-item')) return
            if (img.closest('.content, .note-text')) return
            if (!img.closest('.comment-pic, .reply-pic, .comment-image, .reply-image, .comment-img, .reply-img, [class*="comment-pic"], [class*="reply-pic"], [class*="comment-image"], [class*="reply-image"]')) return
            const candidates = [img.currentSrc, img.getAttribute('data-src'), img.src].filter(Boolean)
            const src = candidates.find(value => /^https?:\/\//i.test(value)) || ''
            if (src && !urls.includes(src)) urls.push(src)
          })
          return urls
        }
        const expandReplyThreads = async (root) => {
          if (!withReplies || !root) return
          const clickedTexts = new Set()
          for (let round = 0; round < 3; round++) {
            const expanders = Array.from(root.querySelectorAll('button, [role="button"], span, div')).filter(el => {
              if (!(el instanceof HTMLElement)) return false
              const text = clean(el)
              if (!text || text.length > 24) return false
              if (!/(展开|更多回复|全部回复|查看.*回复|共\d+条回复)/.test(text)) return false
              if (clickedTexts.has(text)) return false
              return true
            })
            if (!expanders.length) break
            for (const el of expanders) {
              const text = clean(el)
              el.click()
              clickedTexts.add(text)
              await wait(200 + Math.random() * 300)
            }
          }
        }
        const validateImages = (images) => {
          if (!Array.isArray(images)) throw new Error('rednote comments: MALFORMED_ROW — images must be an array')
          const out = []
          for (const raw of images) {
            if (typeof raw !== 'string') throw new Error('rednote comments: MALFORMED_ROW — image URL must be a string')
            let parsed
            try { parsed = new URL(raw.trim()) } catch { throw new Error('rednote comments: MALFORMED_ROW — invalid image URL') }
            if (!/^https?:$/.test(parsed.protocol) || parsed.username || parsed.password) {
              throw new Error('rednote comments: MALFORMED_ROW — unsafe image URL')
            }
            if (!out.includes(parsed.toString())) out.push(parsed.toString())
          }
          return out
        }
        const validateRow = (row) => {
          if (!row || typeof row !== 'object' || Array.isArray(row)) throw new Error('rednote comments: MALFORMED_ROW — row must be an object')
          if (typeof row.text !== 'string' || !row.text.trim()) throw new Error('rednote comments: MALFORMED_ROW — text is required')
          if (!Number.isInteger(row.likes) || row.likes < 0) throw new Error('rednote comments: MALFORMED_ROW — likes must be a non-negative integer')
          if (typeof row.is_reply !== 'boolean') throw new Error('rednote comments: MALFORMED_ROW — is_reply must be boolean')
          return { ...row, images: validateImages(row.images ?? []) }
        }

        const results = []
        const parents = document.querySelectorAll('.parent-comment')
        for (const p of parents) {
          const item = p.querySelector('.comment-item')
          if (!item) continue
          const author = clean(item.querySelector('.author-wrapper .name, .user-name'))
          const text = clean(item.querySelector('.content, .note-text'))
          const likes = parseLikes(item.querySelector('.count'))
          const time = clean(item.querySelector('.date, .time'))
          const images = extractImages(item)
          if (text) results.push(validateRow({ author, text, likes, time, is_reply: false, reply_to: '', images }))

          if (withReplies) {
            await expandReplyThreads(p)
            p.querySelectorAll('.reply-container .comment-item-sub, .sub-comment-list .comment-item').forEach(sub => {
              const sAuthor = clean(sub.querySelector('.name, .user-name'))
              const sContent = sub.querySelector('.content, .note-text')
              const sText = clean(sContent)
              const sReplyTo = clean(sContent?.querySelector(':scope > .nickname')) || author
              const sLikes = parseLikes(sub.querySelector('.count'))
              const sTime = clean(sub.querySelector('.date, .time'))
              const sImages = extractImages(sub)
              if (sText) results.push(validateRow({ author: sAuthor, text: sText, likes: sLikes, time: sTime, is_reply: true, reply_to: sReplyTo, images: sImages }))
            })
          }
        }

        if (!withReplies) return results.slice(0, targetCount)
        const limited = []
        let topCount = 0
        for (const row of results) {
          if (!row.is_reply) topCount++
          if (topCount > targetCount) break
          limited.push(row)
        }
        return limited
      })()
  - map:
      rank: ${{ index + 1 }}
      author: ${{ item.author }}
      text: ${{ item.text }}
      likes: ${{ item.likes }}
      time: ${{ item.time }}
      is_reply: ${{ item.is_reply }}
      reply_to: ${{ item.reply_to }}
      images: ${{ item.images }}
