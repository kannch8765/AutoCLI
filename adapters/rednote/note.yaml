# Adapter logic derived from OpenCLI (https://github.com/jackwener/opencli)
# Original author: jackwener | License: Apache-2.0
site: rednote
name: note
description: "读取 REDnote 笔记正文与互动数据"
domain: www.rednote.com
strategy: cookie
browser: true

args:
  note_url:
    positional: true
    type: string
    required: true
    description: Full signed REDnote note URL with xsec_token

columns: [field, value]

pipeline:
  - navigate: ${{ args.note_url }}
  # AutoCLI wait accepts constants only; use 3s within upstream's 2-5s window.
  - wait: 3
  - evaluate: |
      (() => {
        const bodyText = document.body?.innerText || ''
        const loginWall = /登录后查看|请登录/.test(bodyText)
        const notFound = /页面不见了|笔记不存在|无法浏览/.test(bodyText)
        const securityBlock = /安全限制|访问链接异常/.test(bodyText)
          || /website-login\/error|error_code=300017|error_code=300031/.test(location.href)
        const clean = (el) => (el?.textContent || '').replace(/\s+/g, ' ').trim()
        const scope = document.querySelector('#noteContainer')
        const title = scope
          ? clean(scope.querySelector('#detail-title, .title'))
          : clean(document.querySelector('#detail-title'))
        const desc = scope
          ? clean(scope.querySelector('#detail-desc, .desc, .note-text'))
          : clean(document.querySelector('#detail-desc, .note-text'))
        const author = scope
          ? clean(scope.querySelector('.username, .author-wrapper .name'))
          : clean(document.querySelector('.username, .author-wrapper .name'))
        const likes = clean(document.querySelector('.interact-container .like-wrapper .count'))
        const collects = clean(document.querySelector('.interact-container .collect-wrapper .count'))
        const comments = clean(document.querySelector('.interact-container .chat-wrapper .count'))
        const tags = []
        document.querySelectorAll('#detail-desc a.tag, #detail-desc a[href*="search_result"]').forEach(el => {
          const t = (el.textContent || '').trim()
          if (t) tags.push(t)
        })
        if (securityBlock) throw new Error('rednote note: SECURITY_BLOCK — page temporarily restricted; try again later or from a different session')
        if (loginWall) throw new Error('rednote note: LOGIN_REQUIRED — note content requires login')
        if (notFound) throw new Error('rednote note: NOT_FOUND — note not found or unavailable')
        if (!title && !author) throw new Error('rednote note: EMPTY_RESULT — note page loaded without visible content')
        const numOrZero = (v) => /^\d+/.test(v) ? v : '0'
        const rows = [
          { field: 'title', value: title || '' },
          { field: 'author', value: author || '' },
          { field: 'content', value: desc || '' },
          { field: 'likes', value: numOrZero(likes || '') },
          { field: 'collects', value: numOrZero(collects || '') },
          { field: 'comments', value: numOrZero(comments || '') },
        ]
        if (tags.length) rows.push({ field: 'tags', value: tags.join(', ') })
        return rows
      })()
  - map:
      field: ${{ item.field }}
      value: ${{ item.value }}
