name: tmp-browser-tab-parity-ci
on:
  push:
    branches:
      - fix/browser-tab-recovery-parity
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: rustfmt --edition 2021 --check crates/autocli-core/src/page.rs crates/autocli-browser/src/page.rs crates/autocli-browser/src/types.rs
      - run: cargo test -p autocli-core -p autocli-browser
