name: Persistent Session Recovery Smoke
on:
  push:
    branches:
      - fix/persistent-cookie-site-session

jobs:
  extension:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install extension dependencies
        working-directory: extension
        run: npm ci
      - name: Persistent session tests
        working-directory: extension
        run: npx vitest@3.2.4 run src/background.test.ts
      - name: Build extension
        working-directory: extension
        run: npm run build
      - name: Package extension
        run: |
          cd extension
          zip -r ../extension-ready-v2.zip dist/ icons/ selector/ reader/ manifest.json
      - uses: actions/upload-artifact@v4
        with:
          name: autocli-extension-persistent-recovery
          path: extension-ready-v2.zip
