name: tmp-navigation-recovery-ci
on:
  push:
    branches:
      - fix/navigation-rejected-recovery
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test -p autocli-browser
      - run: cargo test -p autocli-pipeline steps::browser::tests
