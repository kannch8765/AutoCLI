name: Rednote Adapter Smoke

on:
  push:
    branches:
      - fix/persistent-cookie-site-session

jobs:
  rednote:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Rednote adapter parser tests
        run: cargo test -p autocli-discovery --test rednote_adapters
      - name: AutoCLI compile check
        run: cargo check -p autocli
