name: PR Windows Smoke Build
on:
  workflow_dispatch:
    inputs:
      checkout_ref:
        description: Branch to build
        required: true
        default: fix/twitter-upstream-sync
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.checkout_ref }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
      - name: Build AutoCLI
        run: cargo build --release --target x86_64-pc-windows-msvc -p autocli
      - name: Package
        shell: pwsh
        run: Compress-Archive -Path target/x86_64-pc-windows-msvc/release/autocli.exe -DestinationPath autocli-pr65-windows.zip
      - uses: actions/upload-artifact@v4
        with:
          name: autocli-pr65-windows-r2
          path: autocli-pr65-windows.zip
